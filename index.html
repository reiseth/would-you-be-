<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bongo Cat Valentine 💕</title>

    <!-- Cute Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Bongo Cat GIF -->
        <img 
            id="bongoGif" 
            src="https://media.tenor.com/xxPgBuwmddQAAAAm/cat.webp" 
            alt="Bongo Cat Love"
        >

        <!-- Main Text -->
        <h1 id="question">Will you be my Valentine? 💖</h1>

        <!-- Buttons -->
        <div class="buttons">
            <button id="yesBtn">YES 💕</button>
            <button id="noBtn">NO 😿</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
